## WatchParty Backend — Render deployment manifest
## Single service: Express + Socket.IO backend

services:
  - type: web
    name: watchparty-server
    runtime: node
    region: oregon          # Change to singapore/frankfurt if needed
    plan: free              # Upgrade to starter for always-on

    buildCommand: npm ci && npm run db:generate --workspace=apps/server && npm run build && npm run db:migrate:deploy --workspace=apps/server
    startCommand: npm run start --workspace=apps/server

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Database URLs - Link to your PostgreSQL database
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # JWT Secret - Generate with: openssl rand -base64 32
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      # CORS - Set to your frontend URL or * for testing
      - key: CORS_ORIGIN
        value: "*"
